claims:
- id: decay-rate
  kind: computation
  passage: 'Forgetting runs on the calendar: K decays by 6.6% in every idle year, a rate with a microfoundation
    in the organizational-forgetting literature, where production experience measurably depreciates on
    interrupted lines [@argote1990; @benkard2000].'
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /calibration/delta
    reported: 6.6%
    scale: 100
    decimals: 1
    units: annual capability decay while idle
    conditions: calibrated so fourteen idle years price the next unit at 4 times the series cost
- id: build-years-mature
  kind: computation
  passage: The cost of a unit rises exponentially as capability falls, normalized to 1 at the mature programme;
    the time to build rises the same way, from 6 years at maturity to 17.1 at the bottom of the observed
    decay.
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /calibration/build_years_at_mature
    reported: '6'
    decimals: 0
    units: years to build a unit at mature capability
    conditions: calibration
- id: build-years-decayed
