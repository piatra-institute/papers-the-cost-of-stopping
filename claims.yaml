- id: capability-stock
  kind: definition
  passage: One capability stock K between 0 and 1 stands for everything the record describes losing.
  rationale: Defines the model's central state variable; the one-dimensional aggregation is acknowledged
    as a simplification in the limitations section.
- id: two-clocks
  kind: assumption
  passage: 'Learning arrives at completion: K rises only when a unit is finished, the learning-by-doing
    term [@arrow1962] lagged by the build.'
  rationale: The completion lag is the modelling choice that generates the asymmetry; the paper tests
    it directly by moving learning to order time (recovery falls from 22 to 3 years).
- id: calibration-anchoring
  kind: assumption
  passage: 'Both anchors are stated magnitudes, and calibration here is anchoring: the model is disciplined
    by the record, and none of its outputs is an econometric estimate.'
  rationale: States that the two rates are set to documented magnitudes (fourteen-year hiatus, fourfold
    restart premium, 15% pair effect) and that no model output is an econometric estimate.
- id: fossil-price-shock
  kind: assumption
  passage: Fossil generation carries an all-in cost of fuel, carbon, and health of about €60 per MWh;
    2022 arrives as a two-year price shock on whatever fossil generation each scenario still needs, and
    a common-mode fault takes half of the largest ten-year vintage cohort offline for the first shock
    year, which is the French lesson built into the accounting.
  rationale: Input price for the stylized continent; the regime sweep varies the externality component
    from a quarter of base to one and a half times.
- id: deterministic
  kind: assumption
  passage: The model is deterministic; a rerun reproduces every number bit for bit.
  rationale: 'Confirmed by the execution receipt: the recorded rerun reproduced results.json byte for
    byte.'
- id: cost-reading-chooser
  kind: assumption
  passage: 'Replace it with the chooser Europe actually had: one who orders the replacement rate whenever
    the engineering estimate for a new unit, priced off current capability with the industry''s documented
    optimism, comes in under a cost tolerance, and who otherwise launches an exploratory unit every eight
    years to test whether building has become reasonable again.'
  rationale: Behavioural rule for the ratchet experiment (estimate bias, tolerance, probe interval, ten-year
    programme commitment); the threshold's dependence on tolerance is reported rather than hidden.
- id: minimum-continuity
  kind: definition
  passage: 'Defended: a minimum-continuity Europe that retains reactors its regulators judge safe while
    fossil generation remains, and holds a slow standardized replacement sequence, about two units a year
    continent-wide, alongside the renewable expansion that actually occurred.'
  rationale: Defines the one counterfactual the paper defends and separates it from the three it rejects.
- id: chernobyl-ratified
  kind: interpretation
  passage: The retreat predates Chernobyl, so the accident ratified a collapse it did not cause.
  rationale: Chronological inference from the construction-start record (no Western starts between Civaux-2
    in 1991 and Olkiluoto-3 in 2005; collapse by 1983); the causal reading of 1986 as lock-in is interpretive.
- id: probe-self-confirming
  kind: interpretation
  passage: Within the model no single project can disconfirm the stop, because any project cheap enough
    to disconfirm it would require the capability whose absence is the thing being tested.
  rationale: Follows from the locked-state probe costs in the model (every probe above tolerance); mapping
    Olkiluoto-3 and Flamanville-3 to such probes is interpretive.
- id: coordination-failure
  kind: interpretation
  passage: Continuity was affordable at continental scale and unaffordable at national scale, and the
    scale at which it was affordable had no one entitled to choose it.
  rationale: 'Reading of the eight-country game: the planner orders a positive rate while national choosers
    order zero once capability is shared.'
- id: renewables-orthogonal
  kind: interpretation
  passage: The continuity advantage varies by under 1% between early and late renewable arrival, because
    in every scenario renewables displace the same fossil residual.
