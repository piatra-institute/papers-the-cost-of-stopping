- id: calib-restart-4x
  kind: computation
  passage: The construction-start hiatus, April 1991 to August 2005, is counted as fourteen idle years,
    and the decay rate is set so that fourteen idle years price the next unit at 4 times the series cost,
    the auditors' multiple for the projects that ended the hiatus.
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /calibration/cost_ratio_after_hiatus
    reported: '4'
    decimals: 0
    units: unit cost relative to the mature series
    conditions: calibration anchor (hiatus)
