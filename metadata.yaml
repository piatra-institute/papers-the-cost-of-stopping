abstract: 'Between the oil shock of 1973 and the gas shock of 2022, Western Europe built the world''s
  largest fleet of low-carbon power plants, stopped building it, lost the ability to build economically,
  and then attributed the price of that loss to the technology. We treat the retreat as an industrial-capability
  event and make four claims in descending order of evidential support. Construction starts collapsed
  between 1979 and 1983, before Chernobyl, which converted an investment slowdown into political lock-in.
  Stopping comprised five processes on different timescales, and the operating fleet concealed the end
  of new orders for two decades: EU nuclear output peaked at 928 TWh in 2004. The capability loss was
  hysteretic: the first projects of the 2005 restart cost roughly 4 times their original estimates, took
  over seventeen years to build, and were read as evidence that reactors cannot be built economically.
  And construction anywhere in Europe maintained suppliers, skills and regulatory competence everywhere,
  while decisions to order or cancel were national. A deterministic model calibrated to the fourteen-year
  construction hiatus, the fourfold restart premium and a 15% series effect reproduces the record''s shape.
  Output holds near its peak for 28 years after orders stop while capability falls to a third of its mobilization
  level; a cost-reading decision-maker recovers from an order freeze of up to 7 years and remains locked
  beyond it; and fourteen idle years take 22 building years to undo. Against the observed path, retaining
  the closed reactors saves 8% of total system cost, and adding a replacement sequence of two units a
  year saves 24%, an advantage that holds in 21 of 24 regimes.'
web_blurb: Europe stopped building reactors before Chernobyl and lost the capability to build. A calibrated
  model shows the loss hid behind record output, locked after a critical freeze, priced every restart
  as confirmation, and cost 24% more than continuity.
